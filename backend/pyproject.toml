[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "routelens-ai-backend"
version = "0.1.0"
description = "Local API foundation for RouteLens AI"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
